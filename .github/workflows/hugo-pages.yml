name: Build and deploy website
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
env:
  TZ: America/Indiana/Indianapolis
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Read the GitHub Pages address
        uses: actions/configure-pages@v6
        id: pages
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - run: bash scripts/install-hugo.sh
      - run: python -m unittest discover -s tests -v
      - uses: actions/cache@v6.1.0
        with:
          path: .generated/meteor-cache.json
          key: meteor-forecasts-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: meteor-forecasts-
      - uses: actions/cache@v6.1.0
        with:
          path: .generated/drive-gallery
          key: drive-gallery-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: drive-gallery-v2-
      - run: python scripts/build.py
        env:
          HUGO_BASEURL: ${{ steps.pages.outputs.base_url }}/
          FORBIDDEN_PUBLIC_HOSTS: ${{ vars.FORBIDDEN_PUBLIC_HOSTS }}
          DRIVE_GALLERY_CREDENTIALS_JSON: ${{ secrets.DRIVE_GALLERY_CREDENTIALS_JSON }}
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
