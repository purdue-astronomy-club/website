<svg xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="new-moon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
<symbol id="full-moon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="currentColor"/><circle cx="9" cy="9" r="1.5" fill="#080c10" opacity=".25"/><circle cx="15" cy="14" r="2" fill="#080c10" opacity=".2"/></symbol>
<symbol id="first-quarter" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></symbol>
<symbol id="last-quarter" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></symbol>
<symbol id="meteor" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="17" r="3.5"/><path d="m10 14 10-10M4 11l6-6m3 15 6-6M14 10l6-6"/></g></symbol>
<symbol id="mars" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="10" cy="14" r="6"/><path d="m14 10 6-6m-5 0h5v5"/></g></symbol>
<symbol id="jupiter" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="8"/><path d="M6 7q6 3 12 0M4 11q8 3 16 0M5 16q7-2 14 0"/><ellipse cx="15" cy="14" rx="2" ry="1"/></g></symbol>
<symbol id="saturn" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="6"/><ellipse cx="12" cy="12" rx="11" ry="3" transform="rotate(-30 12 12)"/></g></symbol>
<symbol id="uranus" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="6"/><ellipse cx="12" cy="12" rx="3" ry="11" transform="rotate(-20 12 12)"/></g></symbol>
<symbol id="neptune" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 3v18M5 5v5a7 7 0 0 0 14 0V5M8 18h8M3 7l2-2 2 2m10 0 2-2 2 2"/></g></symbol>
<symbol id="planet" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="6"/><ellipse cx="12" cy="12" rx="11" ry="3" transform="rotate(-30 12 12)"/></g></symbol>
<symbol id="sun" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 1v3m0 16v3M1 12h3m16 0h3M4 4l2 2m12 12 2 2M4 20l2-2M18 6l2-2"/></g></symbol>
<symbol id="eclipse" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="10" cy="12" r="7"/><path d="M16 5a7 7 0 0 0 0 14"/></g></symbol>
<symbol id="star" viewBox="0 0 24 24"><path d="m12 2 2.6 7.4L22 12l-7.4 2.6L12 22l-2.6-7.4L2 12l7.4-2.6z" fill="none" stroke="currentColor" stroke-width="1.4"/></symbol>
</defs></svg>
