baseURL: https://purdueastro.club/
title: Purdue Astronomy Club
locale: en-US
timeZone: America/Indiana/Indianapolis
enableRobotsTXT: true
disableKinds:
- taxonomy
- term
cleanDestinationDir: true
permalinks:
  events: /events/:filename/
  astronomy: /astronomy/:filename/
  albums: /albums/:filename/
  astrophotography: /astrophotography/:filename/
  announcements: /announcements/:filename/
markup:
  goldmark:
    renderer:
      unsafe: false
params:
  description: Purdue University's official astronomy club. Free stargazing, astrophotography, and community for all experience levels.
frontmatter:
  publishDate:
  - publish_date
  - publishDate
module:
  mounts:
  - source: content
    target: content
  - source: .generated/content/astronomy
    target: content/astronomy
  - source: .generated/content/drive-gallery
    target: content/astrophotography
  - source: static
    target: static
    files:
    - '! uploads/**'
  - source: .generated/uploads
    target: static/uploads
