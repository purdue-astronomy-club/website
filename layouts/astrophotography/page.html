{{ define "main" }}<div class="container page-shell">{{ partial "breadcrumbs.html" . }}<div class="page-heading"><p class="eyebrow">Astrophotography</p><h1>{{ .Title }}</h1><p class="lead">Image by {{ .Params.photographer }}</p></div><figure class="astro-showcase"><a href="{{ partial "site-url.html" .Params.image }}" data-lightbox data-caption="{{ .Params.caption }}" data-credit="{{ .Params.photographer }}">{{ partial "optimized-image.html" (dict "src" .Params.image "alt" .Params.alt "sizes" "100vw" "loading" "eager") }}<span class="sr-only">Open larger photo</span></a><figcaption>{{ .Params.caption }}</figcaption></figure><div class="prose">{{ .Content }}</div></div>{{ end }}
