{{ define "main" }}<div class="container page-shell">{{ partial "breadcrumbs.html" . }}<div class="page-heading"><p class="eyebrow">For club contributors</p><h1>{{ .Title }}</h1></div><div class="prose">{{ .Content }}</div><div class="detail-facts photo-prep-tool"><label for="photos">Choose JPEG, PNG, or WebP photos</label><input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple><p>Copies are resized to a maximum 2,000 pixels along the long edge. Review each result before uploading.</p><div id="prepared-photos" aria-live="polite"></div><noscript><p>This optional local photo tool requires JavaScript. Use your preferred photo editor to export a web copy instead.</p></noscript></div></div>{{ $js := resources.Get "js/photo-prep.js" | minify | fingerprint }}<script src="{{ $js.RelPermalink }}" defer></script>{{ end }}
