<svg xmlns="http://www.w3.org/2000/svg" viewBox="5 5 160 160" width="170" height="170">
  <title>Purdue Astronomy Club logo</title>
  <!-- The supplied club badge is embedded unchanged. The display filter matches
       the site's dark background, Purdue gold (#cfb991), and warm white. -->
  <defs>
    <clipPath id="badge"><circle cx="85" cy="85" r="79.5"/></clipPath>
    <filter id="theme" color-interpolation-filters="sRGB">
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncR type="table" tableValues="0.02 0.04 0.48 0.86 0.96"/>
        <feFuncG type="table" tableValues="0.03 0.06 0.43 0.77 0.96"/>
        <feFuncB type="table" tableValues="0.04 0.08 0.32 0.60 0.95"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <g clip-path="url(#badge)">
    <image width="170" height="170" filter="url(#theme)" href="data:image/jpeg;base64,"/>
  </g>
</svg>
